# Promote an already-tested TestFlight build to App Store review.
# What’s New is provided manually when starting the workflow.
#
# Required secrets (same ASC key as TestFlight CI):
#   APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_KEY_BASE64
name: App Store Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "ONLY the build number from CI (after build=). Example: 73 — NOT 1.260805.73"
        required: true
        type: string
      app_version:
        description: "Optional. Marketing version after marketing= (e.g. 1.260805.73). Leave blank to auto-detect."
        required: false
        default: ""
        type: string
      whats_new:
        description: "App Store What’s New (shopper-facing). One bullet per line, e.g. - Stronger privacy for your chats"
        required: true
        type: string

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Write What’s New
        run: |
          mkdir -p ios/fastlane/metadata/en-US
          cat << 'EOF' > ios/fastlane/metadata/en-US/release_notes.txt
          ${{ inputs.whats_new }}
          EOF
          if [ ! -s ios/fastlane/metadata/en-US/release_notes.txt ] || [ -z "$(cat ios/fastlane/metadata/en-US/release_notes.txt | tr -d '[:space:]')" ]; then
            echo "whats_new input is empty" >&2
            exit 1
          fi
          echo "What’s New to submit:"
          echo "-----"
          cat ios/fastlane/metadata/en-US/release_notes.txt
          echo "-----"

      - name: Install Ruby gems (Fastlane)
        working-directory: ios
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Prepare App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Submit build for App Store review
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          EXTRA=()
          if [ -n "${{ inputs.app_version }}" ]; then
            EXTRA+=(app_version:"${{ inputs.app_version }}")
          fi
          bundle exec fastlane release \
            build_number:"${{ inputs.build_number }}" \
            "${EXTRA[@]}"

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
