name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          echo "API_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "API_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze
