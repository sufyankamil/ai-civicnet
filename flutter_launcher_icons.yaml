flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  image_path_ios: "assets/icons/app_icon_ios_glass.png"
  image_path_ios_dark_tint: "assets/icons/app_icon_dark.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7B61FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_dark.png"
  adaptive_icon_background_dark: "#121212"
  adaptive_icon_foreground_dark: "assets/icons/app_icon_dark.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
