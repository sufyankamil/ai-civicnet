name: civic_net
description: "A community networking app built with Flutter."
publish_to: 'none'
version: 1.1.0+35

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  provider: ^6.1.5+1
  glassmorphism: ^3.0.0
  go_router: ^17.1.0
  geolocator: ^14.0.2
  shimmer: ^3.0.0
  timeago: ^3.6.1
  supabase_flutter: ^2.8.3
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  firebase_crashlytics: ^5.1.0
  connectivity_plus: ^7.0.0
  logger: ^2.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.3
  app_links: ^7.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.2.1
  toastification: ^3.0.3
  flutter_dotenv: ^6.0.0
  timezone: ^0.11.0
  get: ^4.7.3
  dartz: ^0.10.1
  equatable: ^2.0.8
  shared_preferences: ^2.5.4
  flutter_timezone: ^5.0.1
  firebase_performance: ^0.11.2
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  google_maps_flutter: ^2.14.2
  geocoding: ^4.0.0
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  encrypt: ^5.0.3
  lottie: ^3.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  google_generative_ai: ^0.4.4
  uuid: ^4.5.3
  upgrader: ^12.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
