<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – CivicNet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            color: white;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="card" id="card">
        <div class="spinner"></div>
        <h1>Opening CivicNet…</h1>
        <p>Please wait while we verify your link.</p>
    </div>

    <script>
        const PROXY = 'https://civicnet-supabase-proxy.bxw6wssnct.workers.dev';

        function showError(msg) {
            document.getElementById('card').innerHTML = `
        <div class="icon">❌</div>
        <h1>Link Expired</h1>
        <p>${msg}</p>`;
        }

        function showOpen(deepLink) {
            document.getElementById('card').innerHTML = `
        <div class="icon">✅</div>
        <h1>Almost there!</h1>
        <p>Tap the button below to open CivicNet and set your new password.</p>
        <a class="btn" href="${deepLink}">Open CivicNet App</a>`;
        }

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const type = params.get('type') || 'recovery';

        if (!token) {
            showError('This link is invalid. Please request a new password reset from the app.');
        } else {
            // Redirect through the Cloudflare proxy so the ISP block is bypassed.
            // Supabase verifies the token and redirects to civicnet://reset-password.
            const proxyVerifyUrl =
                `${PROXY}/auth/v1/verify?token=${encodeURIComponent(token)}&type=${type}&redirect_to=civicnet%3A%2F%2Freset-password`;

            const deepLink = `civicnet://reset-password?token=${encodeURIComponent(token)}&type=${type}`;

            // Show the manual button first (in case Android doesn't auto-open)
            showOpen(deepLink);

            // Then navigate through the proxy — the 302 from Supabase → civicnet:// opens the app
            window.location.href = proxyVerifyUrl;
        }
    </script>
</body>

</html>
